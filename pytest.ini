[pytest]
testpaths = tests
addopts =
    -p no:playwright
    -ra
    --strict-markers
    --html=reports/report.html
    --self-contained-html
    --junitxml=reports/junit.xml
markers =
    ui: browser-based end-to-end tests (Playwright)
    api: REST API tests (requests)
    smoke: quick subset for fast feedback
python_files = test_*.py
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
